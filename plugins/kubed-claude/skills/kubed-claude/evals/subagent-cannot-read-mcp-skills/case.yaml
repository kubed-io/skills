schema_version: "1.1"
name: subagent-cannot-read-mcp-skills
expected_outcome: |
  Explains that subagents run in the background by default and a background subagent loses most built-in tools, including ReadMcpResourceTool and ListMcpResourcesTool, while keeping MCP tools. Fix: serve the skills as MCP tools and give that server to the subagent through an inline mcpServers entry in its agent file, and name the starting index in the agent's prompt.
